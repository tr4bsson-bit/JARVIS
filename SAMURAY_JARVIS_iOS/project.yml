name: SamurayJarvis
options:
  bundleIdPrefix: br.com.samuray
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.9'
targets:
  SamurayJarvis:
    type: application
    platform: iOS
    sources: [SamurayJarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.samuray.jarvis
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: O JARVIS usa o microfone para ouvir seus comandos.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: O JARVIS converte sua voz em comandos.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: '1'
