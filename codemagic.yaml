
workflows:
  ios-build:
    name: SAMURAY JARVIS X iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Instalar XcodeGen
        script: |
          brew install xcodegen
      - name: Gerar projeto Xcode
        script: |
          cd SAMURAY_JARVIS_iOS
          xcodegen generate
      
      - name: Compilar aplicativo
        script: |
          cd SAMURAY_JARVIS_iOS
          xcodebuild \
            -project SamurayJarvis.xcodeproj \
            -scheme SamurayJarvis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
 
    artifacts:
      - SAMURAY_JARVIS_iOS/build/Build/Products/Release-iphoneos/*.app
